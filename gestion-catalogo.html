<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Catálogo - Sistema POS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="assets/pos-logo.png" alt="POS Logo">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
                    <li><a href="gestion-catalogo.html" class="active"><i class="fas fa-boxes"></i>Gestión de Catálogo</a></li>
                    <li><a href="gestion-caja.html"><i class="fas fa-cash-register"></i>Gestión de Caja</a></li>
                    <li><a href="gestion-usuarios.html"><i class="fas fa-users"></i>Gestión de Usuarios</a></li>
                    <li><a href="gestion-ventas.html"><i class="fas fa-chart-line"></i>Gestión de Ventas</a></li>
                    <li><a href="gestion-sedes.html"><i class="fas fa-store"></i>Gestión de Sedes</a></li>
                    <li><a href="#"><i class="fas fa-cogs"></i>Configuración</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1>Gestión de Catálogo</h1>
                </div>
                <div class="header-right">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Buscar producto...">
                    </div>
                    <button class="btn btn-primary"><i class="fas fa-plus"></i> Cargar Producto</button>
                </div>
            </header>

            <section class="product-grid">
                <div class="product-card">
                    <img src="assets/producto-1.jpg" alt="Producto 1">
                    <div class="product-details">
                        <h3>Set de Herramientas</h3>
                        <p class="price">$25.50</p>
                    </div>
                    <div class="product-actions">
                        <button class="btn btn-action"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-action btn-danger"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
                </section>
        </main>
    </div>
</body>
</html>
