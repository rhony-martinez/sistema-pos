<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Sistema POS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="assets/pos-logo.png" alt="POS Logo">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
                    <li><a href="gestion-catalogo.html"><i class="fas fa-boxes"></i>Gestión de Catálogo</a></li>
                    <li><a href="gestion-caja.html"><i class="fas fa-cash-register"></i>Gestión de Caja</a></li>
                    <li><a href="gestion-usuarios.html" class="active"><i class="fas fa-users"></i>Gestión de Usuarios</a></li>
                    <li><a href="gestion-ventas.html"><i class="fas fa-chart-line"></i>Gestión de Ventas</a></li>
                    <li><a href="gestion-sedes.html"><i class="fas fa-store"></i>Gestión de Sedes</a></li>
                    <li><a href="#"><i class="fas fa-cogs"></i>Configuración</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1>Gestión de Usuarios</h1>
                </div>
                <div class="header-right">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Buscar usuario...">
                    </div>
                    <button class="btn btn-primary"><i class="fas fa-plus"></i> Crear Usuario</button>
                </div>
            </header>

            <section class="data-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Nombre Completo</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Último Acceso</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>JD</td>
                            <td>Juan Diaz</td>
                            <td>juan.diaz@ejemplo.com</td>
                            <td>Administrador</td>
                            <td><i class="fas fa-circle text-green"></i> Activo</td>
                            <td>Hace 2 horas</td>
                            <td class="table-actions">
                                <button class="btn btn-action"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-action btn-danger"><i class="fas fa-trash-alt"></i></button>
                            </td>
                        </tr>
                        </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
