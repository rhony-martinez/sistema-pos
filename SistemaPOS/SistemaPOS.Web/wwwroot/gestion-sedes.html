<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Sedes - Sistema POS</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="js/config.js"></script>
    <script src="js/gestion-sedes.js" defer></script>
    <style>
        /* Modal básico */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-modal {
            margin-top: 1.5rem;
            background: #007bff;
            color: #fff;
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
        }
        .btn-modal:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="assets/pos-logo.png" alt="POS Logo">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard-adm-gral.html"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
                    <li><a href="gestion-sedes.html" class="active"><i class="fas fa-store"></i>Gestión de Sedes</a></li>
                    <li><a href="gestion-usuarios-adm-gral.html"><i class="fas fa-users"></i>Gestión de Usuarios</a></li>
                    <li><a href="gestion-catalogo.html" class="disabled"><i class="fas fa-boxes"></i>Gestión de Catálogo</a></li>
                    <li><a href="gestion-caja.html" class="disabled"><i class="fas fa-cash-register"></i>Gestión de Caja</a></li>
                    <li><a href="gestion-ventas.html" class="disabled"><i class="fas fa-chart-line"></i>Gestión de Ventas</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1>Gestión de Sedes</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-filter"><i class="fas fa-filter"></i>Consultar Sede</button>
                    <button class="btn btn-primary"><i class="fas fa-plus"></i> Crear Sede</button>
                </div>
            </header>

            <section class="data-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID de Sede</th>
                            <th>Nombre</th>
                            <th>Dirección</th>
                            <th>Ubicacion</th>
                            <th>Telefono</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Filas generadas por JS -->
                    </tbody>
                </table>
            </section>
        </main>

        <!-- Modal para mensajes -->
<div id="modal" class="modal">
    <div class="modal-content">
        <p id="modal-text"></p>
        <div class="modal-buttons">
            <button id="modal-btn" class="btn-modal">Aceptar</button>
            <button id="modal-cancel" class="btn-modal cancel">Cancelar</button>
        </div>
    </div>
</div>

<style>
    .modal-buttons {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 1.5rem;
    }
    .btn-modal.cancel {
        background: #e63946;
    }
    .btn-modal.cancel:hover {
        background: #b8323b;
    }
</style>

    </div>
</body>
</html>
