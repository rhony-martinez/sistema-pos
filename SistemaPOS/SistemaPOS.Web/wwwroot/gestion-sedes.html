<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Sedes - Sistema POS</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="assets/pos-logo.png" alt="POS Logo">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard-adm-gral.html"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
                    <li><a href="gestion-sedes.html" class="active"><i class="fas fa-store"></i>Gestión de Sedes</a></li>
                    <li><a href="gestion-usuarios-adm-gral.html"><i class="fas fa-users"></i>Gestión de Usuarios</a></li>
                    <li><a href="gestion-catalogo.html" class="disabled"><i class="fas fa-boxes"></i>Gestión de Catálogo</a></li>
                    <li><a href="gestion-caja.html" class="disabled"><i class="fas fa-cash-register"></i>Gestión de Caja</a></li>
                    <li><a href="gestion-ventas.html" class="disabled"><i class="fas fa-chart-line"></i>Gestión de Ventas</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1>Gestión de Sedes</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary"><i class="fas fa-plus"></i> Crear Sede</button>
                </div>
            </header>

            <section class="data-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID de Sede</th>
                            <th>Nombre</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Administrador</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>#S-001</td>
                            <td>Sede Central</td>
                            <td>Av. Principal #123</td>
                            <td>555-1234</td>
                            <td>Juan Pérez</td>
                            <td>
                                <button class="btn btn-action"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-action btn-danger"><i class="fas fa-trash-alt"></i></button>
                            </td>
                        </tr>
                        </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
