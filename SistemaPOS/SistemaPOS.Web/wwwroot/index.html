<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System - Iniciar Sesión</title>
    <!-- Favicon en formato SVG -->
    <link rel="icon" href="assets/store.svg" type="image/svg+xml">
    <!-- Alternativo en formato ICO -->
    <link rel="icon" href="assets/pos-logo.ico" type="image/x-icon">
    <!-- Alternativa al favico (PNG) -->
    <link rel="icon" href="assets/pos-logo.png" type="image/png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/gestion-user.css"> <!-- Para traer el diseño de la modal -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="js/config.js"></script>
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="assets/pos-logo.png" alt="POS Logo">
            </div>
            <h2>Bienvenido de vuelta</h2>
            <p>Por favor, ingresa tus datos para continuar</p>

            <form>
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Tu usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>

                <!-- Mensaje de error -->
                <p id="error-message"></p>
            </form>


        </div>
    </div>
    <!-- Modal para mensajes -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <p id="modal-text"></p>
            <button id="modal-btn" class="btn-modal">Aceptar</button>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
