<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado Consulta - POS</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Ajustes mínimos de estilo internos */
        .data-table-container {
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .btn-volver {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-volver:hover {
            background-color: #0056b3;
        }

        .no-data {
            color: red;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="assets/SistemaPOS_logo.jpg" alt="POS">
        </div>
    </aside>

    <main class="main-content">
        <h1>Gestión de Sedes</h1>
        <section class="data-table-container">
            <table id="tablaResultado">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Ciudad</th>
                        <th>Departamento</th>
                        <th>Ubicación</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="resultado">
                    <tr><td colspan="8" class="no-data">Cargando datos...</td></tr>
                </tbody>
            </table>

            <div style="text-align: center;">
                <button class="btn-volver" onclick="window.location.href='consultar_sede.html'">Volver</button>
            </div>
        </section>
    </main>
</div>

<script>
    const sedeData = localStorage.getItem("sedeEncontrada");
    const resultadoBody = document.getElementById("resultado");

    if (!sedeData) {
        resultadoBody.innerHTML = `
            <tr><td colspan="8" class="no-data">❌ No hay datos para mostrar.</td></tr>
        `;
    } else {
        const sede = JSON.parse(sedeData);
        resultadoBody.innerHTML = `
            <tr>
                <td>${sede.sedE_ID ?? sede.SEDE_ID ?? "N/A"}</td>
                <td>${sede.sedE_NOMBRE ?? sede.SEDE_NOMBRE ?? "N/A"}</td>
                <td>${sede.sedE_CIUDAD ?? sede.SEDE_CIUDAD ?? "N/A"}</td>
                <td>${sede.sedE_DEPARTAMENTO ?? sede.SEDE_DEPARTAMENTO ?? "N/A"}</td>
                <td>${sede.sedE_UBICACION ?? sede.SEDE_UBICACION ?? "N/A"}</td>
                <td>${sede.sedE_CORREO ?? sede.SEDE_CORREO ?? "N/A"}</td>
                <td>${sede.sedE_TELEFONO ?? sede.SEDE_TELEFONO ?? "N/A"}</td>
                <td>${sede.sedE_ESTADO ?? sede.SEDE_ESTADO ?? "N/A"}</td>
            </tr>
        `;
    }
</script>
</body>
</html>
