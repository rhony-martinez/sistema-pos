<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Sistema POS</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</head>

<body>
    <div class="app-container">
        <!--  SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="assets/pos-logo.png" alt="POS Logo">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard-adm-local.html"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
                    <li><a href="gestion-catalogo.html"><i class="fas fa-boxes"></i>Gestión de Catálogo</a></li>
                    <li><a href="gestion-usuarios-adm-local.html" class="active"><i class="fas fa-users"></i>Gestión de Usuarios</a></li>
                    <li><a href="gestion-ventas.html"><i class="fas fa-chart-line"></i>Gestión de Ventas</a></li>
                    <li><a href="gestion-caja.html" class="disabled"><i class="fas fa-cash-register"></i>Gestión de Caja</a></li>
                    <li><a href="gestion-sedes.html" class="disabled"><i class="fas fa-store"></i>Gestión de Sedes</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1>Gestión de Usuarios</h1>
                </div>
                <div class="header-right">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Buscar usuario...">
                    </div>
                    <button class="btn btn-primary"><i class="fas fa-plus"></i> Crear Cajero</button>
                </div>
            </header>

            <section class="data-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Email</th>
                            <th>Estado</th>
                            <th>Sede Id</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>juand</td>
                            <td>Juan</td>
                            <td>Diaz</td>
                            <td>juan.diaz@ejemplo.com</td>
                            <td><i class="fas fa-circle"></i> Activo</td>
                            <td>1</td>
                            <td class="table-actions">
                                <button class="btn btn-action"><i class="fas fa-edit"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="js/gestion-usuarios-adm-local.js"></script>
</body>
</html>
