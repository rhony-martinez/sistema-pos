<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Admin Local</title>
    <link rel="stylesheet" href="css/reg-adm-local.css">
</head>
<body>

    <main class="page-wrapper">
        <section class="register-card">

            <!-- Encabezado -->
            <div class="form-header">
                <img src="assets/pos-logo.png" alt="Logo POS" class="logo">
                <div>
                    <h1>Registrar Administrador Local</h1>
                    <p>Llene los campos para el administrador local</p>
                </div>
            </div>

            <form class="register-form">
                <!-- Datos Personales -->
                <h2 class="section-title">Datos Personales</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Primer nombre*</label>
                        <input type="text" placeholder="Primer nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Segundo nombre</label>
                        <input type="text" placeholder="Segundo nombre">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Primer Apellido*</label>
                        <input type="text" placeholder="Primer Apellido" required>
                    </div>
                    <div class="form-group">
                        <label>Segundo Apellido</label>
                        <input type="text" placeholder="Segundo apellido">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group small">
                        <label>Tipo*</label>
                        <select required>
                            <option value="CC">CC</option>
                            <option value="TI">TI</option>
                            <option value="CE">CE</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Número*</label>
                        <input type="text" placeholder="Número Identificación" required>
                    </div>
                </div>

                <!-- Información de Contacto -->
                <h2 class="section-title">Información de Contacto</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Correo electrónico*</label>
                        <input type="email" placeholder="Correo electrónico" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono*</label>
                        <input type="tel" placeholder="Teléfono" required>
                    </div>
                </div>

                <!-- Acceso -->
                <h2 class="section-title">Acceso</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Usuario*</label>
                        <input type="text" placeholder="Nombre de Usuario" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña*</label>
                        <input type="password" placeholder="Contraseña" required>
                    </div>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn-primary">Registrar Administrador</button>
                </div>
            </form>

        </section>
    </main>

</body>
</html>
