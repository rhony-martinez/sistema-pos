<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Caja - Sistema POS</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="js/config.js"></script>
</head>
<!-- Botón flotante de cerrar sesión -->
<button id="logoutBtn" class="btn-logout">
    <i class="fas fa-sign-out-alt"></i> Cerrar sesión
</button>

<script src="js/auth.js"></script>
<script>
document.getElementById("logoutBtn").addEventListener("click", async () => {
    const token = sessionStorage.getItem("token");
    if (!token) {
        sessionStorage.clear();
        window.location.href = "index.html";
        return;
    }

    try {
        const res = await fetch("http://localhost:5289/api/auth/logout", {
            method: "POST",
            headers: { 
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            }
        });

        // Limpiar sesión y redirigir sin importar el estado
        sessionStorage.clear();
        window.location.href = "index.html";
    } catch (err) {
        console.error("Error al cerrar sesión:", err);
        alert("Error al cerrar sesión. Intenta nuevamente.");
    }
});
</script>

<body>
    <div class="app-container">

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1>Gestión de Caja</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary"><i class="fas fa-plus"></i> Abrir Caja</button>
                    <button class="btn btn-danger"><i class="fas fa-times"></i> Cerrar Caja</button>
                </div>
            </header>

            <section class="caja-section">
                <div class="caja-card">
                    <h3>Estado de Caja Actual</h3>
                    <div class="caja-info">
                        <p>Saldo Inicial: <span>$200.000</span></p>
                        <p>Ventas Netas: <span>$8,259.00</span></p>
                        <p>Ingresos Adicionales: <span>$0.00</span></p>
                        <p>Egresos: <span>$50.00</span></p>
                    </div>
                    <div class="saldo-final">
                        <h4>Saldo Final Estimado:</h4>
                        <p>$8,409.00</p>
                    </div>
                    <button class="btn btn-primary" style="width: 100%;">Arquear Caja</button>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
