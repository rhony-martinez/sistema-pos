<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Caja - Sistema POS</title>
    <!-- Favicon en formato SVG -->
    <link rel="icon" href="assets/store.svg" type="image/svg+xml">
    <!-- Alternativo en formato ICO -->
    <link rel="icon" href="assets/pos-logo.ico" type="image/x-icon">
    <!-- Alternativa al favico (PNG) -->
    <link rel="icon" href="assets/pos-logo.png" type="image/png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/caja.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="js/config.js"></script>
</head>

<!-- Botón flotante de cerrar sesión -->
<button id="logoutBtn" class="btn-logout">
  <i class="fas fa-sign-out-alt"></i> Cerrar sesión
</button>

<body>
  <div class="app-container">
    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <h1>Gestión de Caja</h1>
        </div>
        <div class="header-right">
          <!-- NUEVO: Botón Crear Venta -->
          <button id="btn-crear-venta" class="btn btn-primary">
            <i class="fas fa-cash-register"></i> Crear Venta
          </button>

          <button id="btn-abrir-caja" class="btn btn-primary">
            <i class="fas fa-plus"></i> Abrir Caja
          </button>
<button id="btn-cerrar-caja" class="btn btn-danger">
  <i class="fas fa-times"></i> Cerrar Caja
</button>

        </div>
      </header>

      <section class="caja-section">
        <div class="caja-card">
          <h3>Estado de Caja Actual</h3>
          <div class="caja-info">
<p>Saldo Inicial: <span id="saldo-inicial">$0</span></p>
<p>Ventas Netas: <span id="ventas-netas">$0</span></p>
<p>Ingresos Adicionales: <span id="ingresos-adicionales">$0</span></p>
<p>Egresos: <span id="egresos">$0</span></p>

<div class="saldo-final">
  <h4>Saldo Final Estimado:</h4>
  <p id="saldo-final">$0</p>
</div>

          <button class="btn btn-primary" style="width: 100%;">Arquear Caja</button>
        </div>
      </section>
    </main>
  </div>

  <!-- ===========================
    MODAL ABRIR CAJA
  =========================== -->
  <div id="modalAbrirCaja" class="modal oculto">
    <div class="modal-content modal-medium">
  
      <!-- Encabezado del formulario -->
      <div class="form-header">
        <img src="assets/img/logo.png" class="logo" alt="Logo">
        <div>
          <h1>Apertura de Caja</h1>
          <p>Registra el monto inicial de la caja para esta sede</p>
        </div>
      </div>
  
      <!-- Formulario -->
      <form id="formAbrirCaja" class="register-form">
  
        <!-- Información de la sede -->
        <div class="form-group">
          <label for="abrirCajaSede">Sede</label>
          <input type="text" id="abrirCajaSede" readonly class="input-readonly" placeholder="Nombre de la sede">
        </div>
  
        <!-- Monto inicial -->
        <div class="form-group">
          <label for="abrirCajaMonto">Monto inicial</label>
          <input type="number" id="abrirCajaMonto" placeholder="Ingrese el monto inicial" min="1">
          <p id="errorMonto" class="error-msg oculto">Debe ingresar un monto válido</p>
        </div>
  
        <!-- Botones -->
        <div class="btn-container">
          <button type="button" id="btnCancelarAbrirCaja" class="btn-secondary">
            Cancelar
          </button>
  
          <button type="submit" id="btnConfirmarAbrirCaja" class="btn-primary">
            Abrir caja
          </button>
        </div>
  
      </form>
    </div>
  </div>

  <!-- Scripts (al final del body para no bloquear el render) -->
  <script src="js/auth.js"></script>
  <script src="js/gestion-caja.js"></script>
  <script src="js/abrir-caja.js"></script>
</body>
</html>
