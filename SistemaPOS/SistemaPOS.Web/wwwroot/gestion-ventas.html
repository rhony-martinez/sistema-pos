<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Ventas - Sistema POS</title>
    <!-- Favicon en formato SVG -->
    <link rel="icon" href="assets/store.svg" type="image/svg+xml">
    <!-- Alternativo en formato ICO -->
    <link rel="icon" href="assets/pos-logo.ico" type="image/x-icon">
    <!-- Alternativa al favico (PNG) -->
    <link rel="icon" href="assets/pos-logo.png" type="image/png">

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>

<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="assets/pos-logo.png" alt="POS Logo" />
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="dashboard-adm-local.html"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
          <li><a href="gestion-catalogo.html"><i class="fas fa-boxes"></i>Gestión de Catálogo</a></li>
          <li><a href="gestion-usuarios-adm-local.html"><i class="fas fa-users"></i>Gestión de Usuarios</a></li>
          <li><a href="gestion-ventas.html" class="active"><i class="fas fa-chart-line"></i>Gestión de Ventas</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <h1>Gestión de Ventas</h1>
        </div>
        <div class="header-right">
  <label style="display:flex; align-items:center; gap:.5rem;">
    <span>Desde</span>
    <input id="fecha-desde" type="date" class="input-date">
  </label>

  <label style="display:flex; align-items:center; gap:.5rem;">
    <span>Hasta</span>
    <input id="fecha-hasta" type="date" class="input-date">
  </label>

  <button id="btn-informe" class="btn btn-primary">Generar Informe</button>
</div>

      </header>

      <section class="data-table-container">
        <div class="table-header">
          <h2>Registro de Ventas</h2>
        </div>

        <table>
          <thead>
            <tr>
              <th>ID de Venta</th>
              <th>Fecha</th>
              <th>Monto Total</th>
              <th>Método de Pago</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <!-- ✅ Aquí se cargan las ventas desde JS -->
          <tbody id="ventas-tbody">
            <tr>
              <td colspan="5">Cargando...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
  
  <!-- ===== MODAL CONFIRM (Cancelar / Sí, eliminar) ===== -->
<div id="ui-confirm" class="m-overlay hidden">
  <div class="m-card">
    <p id="ui-ctext" class="m-text">¿Seguro?</p>
    <div class="m-actions two">
      <button id="ui-cancel" class="m-btn m-btn-gray" type="button">Cancelar</button>
      <button id="ui-yes" class="m-btn m-btn-danger" type="button">Sí, eliminar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL MENSAJE (OK) ===== -->
<div id="ui-modal" class="m-overlay hidden">
  <div class="m-card">
    <p id="ui-text" class="m-text">Mensaje</p>
    <div class="m-actions one">
      <button id="ui-ok" class="m-btn m-btn-primary" type="button">OK</button>
    </div>
  </div>
</div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/gestion-ventas.js"></script>

</body>
</html>
