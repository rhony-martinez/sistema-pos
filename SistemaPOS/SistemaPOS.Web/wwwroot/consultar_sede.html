<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Sede - Sistema POS</title>
  <link rel="stylesheet" href="css/consultar-sede.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="js/config.js"></script>
</head>
<body>
  <div class="app-container">
    <main class="main-content">
      <header class="header">
        <div class="header-right">
          <div class="logo">
            <img src="assets/pos-logo.png" alt="POS Logo">
          </div>
          <h1 class="header-title">Consultar Sede</h1>
        </div>

        <div class="header-left">
          <a href="gestion-sedes.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Volver a Gestión de Sedes
          </a>
        </div>
      </header>

      <section class="form-section">
        <form id="formBuscar" class="search-form">
          <h2 class="form-title">Buscar Sede</h2>
          <p class="form-subtitle">Ingresa el nombre o código de la sede para consultarla</p>

          <div class="form-row">
            <div class="form-group">
              <label for="nombreSede">Nombre de la Sede</label>
              <input type="text" id="nombreSede" placeholder="Ej: Sede Central">
            </div>

            <div class="form-group">
              <label for="idSede">Código de la Sede</label>
              <input type="number" id="idSede" placeholder="Ej: 1">
            </div>
          </div>

          <div class="btn-container">
            <button type="submit" class="btn-primary">
              <i class="fas fa-search"></i> Buscar Sede
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="js/consultar_sede.js"></script>
</body>
</html>
