<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Crear Sede | SistemaPOS</title>
    <!-- Favicon en formato SVG -->
    <link rel="icon" href="assets/store.svg" type="image/svg+xml">
    <!-- Alternativo en formato ICO -->
    <link rel="icon" href="assets/pos-logo.ico" type="image/x-icon">
    <!-- Alternativa al favico (PNG) -->
    <link rel="icon" href="assets/pos-logo.png" type="image/png">
    <!-- Tus estilos -->
    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/pos.css">

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script defer src="js/crear-sedes.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="assets/pos-logo.png" alt="POS">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a class="active" href="gestion-sedes.html">Gestión de Sedes</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Contenido principal -->
        <main class="main-content">
            <div class="main-inner">
                <div class="header">
                    <h1>Registrar Sede</h1>
                </div>

                <section class="form-card">
                    <form id="form-sede" novalidate>
                        <!-- Datos de la sede -->
                        <h3 class="section-title">Datos de la Sede</h3>
                        <div class="grid">
                            <div>
                                <div class="label">Nombre de la Sede <span style="color:#FF6347">*</span></div>
                                <input class="input" data-field="nombre" id="nombre" placeholder="Nombre de la Sede" required>
                                <div class="feedback-inline" data-feedback="nombre"></div>
                            </div>
                        </div>

                        <!-- Información -->
                        <h3 class="section-title">Información de la sede</h3>
                        <div class="grid">
                            <div>
                                <div class="label">Dirección <span style="color:#FF6347">*</span></div>
                                <input class="input" data-field="direccion" id="direccion" placeholder="Dirección" required>
                                <div class="feedback-inline" data-feedback="direccion"></div>
                            </div>

                            <div>
                                <div class="label">Ciudad <span style="color:#FF6347">*</span></div>
                                <input class="input" data-field="ciudad" id="ciudad" placeholder="Ciudad" required>
                                <div class="feedback-inline" data-feedback="ciudad"></div>
                            </div>

                            <div>
                                <div class="label">Departamento <span style="color:#FF6347">*</span></div>
                                <input class="input" data-field="departamento" id="departamento" placeholder="Departamento"             required>
                                <div class="feedback-inline" data-feedback="departamento"></div>
                            </div>
                        
                            <div>
                                <div class="label">Ubicación <span style="color:#FF6347">*</span></div>
                                <input class="input" data-field="ubicacion" id="ubicacion" placeholder="Ubicación" required>
                                <div class="feedback-inline" data-feedback="ubicacion"></div>
                            </div>
                            </div>
                        
                            <!-- Contacto -->
                            <h3 class="section-title">Contacto</h3>
                            <div class="grid">
                                <div>
                                    <div class="label">Teléfono <span style="color:#FF6347">*</span></div>
                                    <input class="input" data-field="telefono" id="telefono" placeholder="Teléfono" required>
                                    <div class="feedback-inline" data-feedback="telefono"></div>
                                </div>
                                <div>
                                    <div class="label">Correo electrónico <span style="color:#FF6347">*</span></div>
                                    <input class="input" data-field="correo" id="correo" placeholder="contacto@sede.com"            required>
                                    <div class="feedback-inline" data-feedback="correo"></div>
                                </div>
                            </div>

                        <!-- Configuración -->
                        <h3 class="section-title">Configuración</h3>
                        <div class="grid">
                            <div>
                                <div class="label">Estado</div>
                                <input class="input" data-field="estado" id="estado" value="ACTIVA" readonly>
                            </div>
                        </div>

                        <!-- Botones -->
                        <div class="form-actions">
                            <button class="btn btn-primary" type="submit">Registrar Sede</button>
                            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
                        </div>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal de mensajes -->
    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content">
            <p id="modal-text"></p>
            <button id="modal-btn" class="btn btn-primary">Aceptar</button>
        </div>
    </div>
</body>
</html>
