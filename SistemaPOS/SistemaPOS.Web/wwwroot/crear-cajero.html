<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Cajero</title>
  <link rel="stylesheet" href="css/registrar-user.css">
  <script src="js/auth.js"></script>


</head>

<body>
  <main class="page-wrapper">
    <section class="register-card">
      <div class="form-header">
        <img src="assets/pos-logo.png" alt="Logo POS" class="logo">
        <div>
          <h1>Registrar Cajero</h1>
          <p>Complete todos los campos obligatorios</p>
        </div>
      </div>

      <form id="form-crear-cajero" class="register-form" novalidate>

        <h2 class="section-title">Datos Personales</h2>

        <div class="form-row">
          <div class="form-group">
            <label>ID Usuario*</label>
            <input type="number" id="usuId" placeholder="Ej: 201" required>
          </div>
          <div class="form-group">
            <label>ID Sede*</label>
            <input type="number" id="sedeId" readonly>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Primer nombre*</label>
            <input type="text" id="primerNombre" placeholder="Primer nombre" required>
          </div>
          <div class="form-group">
            <label>Segundo nombre</label>
            <input type="text" id="segundoNombre" placeholder="Segundo nombre">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Primer Apellido*</label>
            <input type="text" id="primerApellido" placeholder="Primer apellido" required>
          </div>
          <div class="form-group">
            <label>Segundo Apellido</label>
            <input type="text" id="segundoApellido" placeholder="Segundo apellido">
          </div>
        </div>

        <h2 class="section-title">Información de Contacto</h2>

        <div class="form-row">
          <div class="form-group">
            <label>Correo electrónico*</label>
            <input type="email" id="correo" placeholder="Correo electrónico" required>
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="telefono" placeholder="Teléfono">
          </div>
        </div>

        <h2 class="section-title">Acceso</h2>

        <div class="form-row">
          <div class="form-group">
            <label>Usuario*</label>
            <input type="text" id="username" placeholder="Nombre de Usuario" required>
          </div>
          <div class="form-group">
            <label>Contraseña*</label>
            <input type="password" id="password" placeholder="Contraseña" required>
          </div>
        </div>

        <input type="hidden" id="rol" value="CAJERO">

        <div class="btn-container">
          <button type="submit" class="btn-primary">Registrar Cajero</button>
          <button type="button" class="btn-secondary" id="cancelBtn">Cancelar</button>
        </div>
      </form>
    </section>
  </main>

  <!-- 🔹 Modal para mensajes -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <p id="modal-text"></p>
      <button id="modal-btn" class="btn-modal">Aceptar</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!checkAuth()) return;

      const modal = document.getElementById("modal");
      const modalText = document.getElementById("modal-text");
      const modalBtn = document.getElementById("modal-btn");

      function showModal(message, callback) {
        modalText.textContent = message;
        modal.style.display = "flex";
        modalBtn.onclick = () => {
          modal.style.display = "none";
          if (callback) callback();
        };
      }

      // 🔸 Solo permitir números en ID
      const idInput = document.getElementById("usuId");
      idInput.addEventListener("keypress", (e) => {
        if (!/[0-9]/.test(e.key)) {
          e.preventDefault();
          showModal("Solo se permiten números en el campo ID.");
        }
      });

      // 🔹 Cargar sede automáticamente
      try {
        const profile = await getUserProfile();
        if (profile?.sedeId) {
          document.getElementById("sedeId").value = profile.sedeId;
        }
      } catch (error) {
        console.error("Error al obtener sede:", error);
      }

      const form = document.getElementById("form-crear-cajero");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // 🔸 Limpiar errores previos
        document.querySelectorAll(".input-error").forEach(el => el.classList.remove("input-error"));

        const requiredFields = ["usuId", "primerNombre", "primerApellido", "correo", "username", "password"];
        let missing = [];

        requiredFields.forEach(id => {
          const field = document.getElementById(id);
          if (!field.value.trim()) {
            field.classList.add("input-error");
            missing.push(id);
          }
        });

        if (missing.length > 0) {
          showModal("Tienes campos vacíos. Complétalos antes de continuar.");
          return;
        }

        const payload = {
          usuId: parseInt(document.getElementById("usuId").value),
          primerNombre: document.getElementById("primerNombre").value.trim(),
          segundoNombre: document.getElementById("segundoNombre").value.trim(),
          primerApellido: document.getElementById("primerApellido").value.trim(),
          segundoApellido: document.getElementById("segundoApellido").value.trim(),
          correo: document.getElementById("correo").value.trim(),
          telefono: document.getElementById("telefono").value.trim(),
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value.trim(),
          rol: "CAJERO",
          sedeId: parseInt(document.getElementById("sedeId").value)
        };

        try {
          const res = await fetch("http://localhost:5289/api/users", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${sessionStorage.getItem("token")}`
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const err = await res.json();
            if (err.error?.includes("ya existe")) {
              document.getElementById("usuId").classList.add("input-error");
              showModal("Ya existe un cajero con esa ID.");
            } else {
              showModal("Error al crear cajero: " + (err.error || "Error desconocido"));
            }
            return;
          }

          showModal("✅ Cajero creado correctamente.", () => {
            window.location.href = "gestion-usuarios-adm-local.html";
          });

        } catch (error) {
          console.error(error);
          showModal("❌ Error de conexión con el servidor.");
        }
      });

      // 🔹 Botón cancelar
      document.getElementById("cancelBtn").addEventListener("click", () => {
        window.location.href = "gestion-usuarios-adm-local.html";
      });
    });
  </script>
</body>
</html>
