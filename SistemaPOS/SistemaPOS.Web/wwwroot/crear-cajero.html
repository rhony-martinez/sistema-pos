<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Cajero</title>
  <link rel="stylesheet" href="css/registrar-user.css">
  <script src="js/auth.js"></script>
</head>
<body>
  <main class="page-wrapper">
    <section class="register-card">
      <!-- Encabezado -->
      <div class="form-header">
        <img src="assets/pos-logo.png" alt="Logo POS" class="logo">
        <div>
          <h1>Registrar Cajero</h1>
          <p>Complete todos los campos obligatorios</p>
        </div>
      </div>

      <form id="form-crear-cajero" class="register-form">
        <!-- Datos Personales -->
        <h2 class="section-title">Datos Personales</h2>

        <div class="form-row">
          <div class="form-group">
            <label>ID Usuario*</label>
            <input type="number" id="usuId" placeholder="Ej: 201" required>
          </div>
          <div class="form-group">
            <label>ID Sede*</label>
            <input type="number" id="sedeId" readonly>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Primer nombre*</label>
            <input type="text" id="primerNombre" placeholder="Primer nombre" required>
          </div>
          <div class="form-group">
            <label>Segundo nombre</label>
            <input type="text" id="segundoNombre" placeholder="Segundo nombre">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Primer Apellido*</label>
            <input type="text" id="primerApellido" placeholder="Primer apellido" required>
          </div>
          <div class="form-group">
            <label>Segundo Apellido</label>
            <input type="text" id="segundoApellido" placeholder="Segundo apellido">
          </div>
        </div>

        <!-- Información de Contacto -->
        <h2 class="section-title">Información de Contacto</h2>

        <div class="form-row">
          <div class="form-group">
            <label>Correo electrónico*</label>
            <input type="email" id="correo" placeholder="Correo electrónico" required>
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="telefono" placeholder="Teléfono">
          </div>
        </div>

        <!-- Acceso -->
        <h2 class="section-title">Acceso</h2>

        <div class="form-row">
          <div class="form-group">
            <label>Usuario*</label>
            <input type="text" id="username" placeholder="Nombre de Usuario" required>
          </div>
          <div class="form-group">
            <label>Contraseña*</label>
            <input type="password" id="password" placeholder="Contraseña" required>
          </div>
        </div>

        <!-- Rol oculto -->
        <input type="hidden" id="rol" value="CAJERO">

        <div class="btn-container">
          <button type="submit" class="btn-primary">Registrar Cajero</button>
          <button type="button" class="btn-secondary" id="cancelBtn">Cancelar</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!checkAuth()) return;

      // ✅ Cargar sede automáticamente del usuario logueado
      try {
        const profile = await getUserProfile();
        if (profile?.sedeId) {
          document.getElementById("sedeId").value = profile.sedeId;
        } else {
          alert("⚠️ No se pudo obtener el ID de sede del usuario actual.");
        }
      } catch (error) {
        console.error("Error al obtener sede:", error);
      }

      // ✅ Enviar formulario
      const form = document.getElementById("form-crear-cajero");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const payload = {
          usuId: parseInt(document.getElementById("usuId").value),
          primerNombre: document.getElementById("primerNombre").value.trim(),
          segundoNombre: document.getElementById("segundoNombre").value.trim(),
          primerApellido: document.getElementById("primerApellido").value.trim(),
          segundoApellido: document.getElementById("segundoApellido").value.trim(),
          correo: document.getElementById("correo").value.trim(),
          telefono: document.getElementById("telefono").value.trim(),
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value.trim(),
          rol: "CAJERO",
          sedeId: parseInt(document.getElementById("sedeId").value)
        };

        try {
          const res = await fetch("http://localhost:5289/api/users", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${sessionStorage.getItem("token")}`
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || "Error al crear cajero");
          }

          alert("✅ Cajero creado correctamente");
          form.reset();
          window.location.href = "gestion-usuarios-adm-local.html";
        } catch (error) {
          console.error(error);
          alert("❌ No se pudo crear el cajero: " + error.message);
        }
      });

      // ✅ Cancelar
      document.getElementById("cancelBtn").addEventListener("click", () => {
        window.location.href = "gestion-usuarios-adm-local.html";
      });
    });
  </script>
</body>
</html>
