<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado Consulta - Sistema POS</title>
    <link rel="stylesheet" href="css/consultar-sede.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="app-container">
    <!-- Encabezado con logo -->
    <div class="logo-container">
        <img src="assets/pos-logo.png" alt="POS Logo">
    </div>

    <main class="main-content">
        <h1>Resultado de la Consulta</h1>

        <section class="data-table-container">
            <table id="tablaResultado">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Ciudad</th>
                        <th>Departamento</th>
                        <th>Ubicación</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="resultado">
                    <tr><td colspan="8" class="no-data">Cargando datos...</td></tr>
                </tbody>
            </table>
        </section>

        <div style="text-align: center;">
            <button class="btn-volver" onclick="window.location.href='consultar_sede.html'">
                <i class="fas fa-search"></i> Nueva Búsqueda
            </button>
        </div>
    </main>
</div>

<script src="js/consultar_sede_resultado.js"></script>
</body>
</html>
